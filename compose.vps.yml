# Deploy na VPS da WPX (atrás do Traefik da rede wpxnet, HTTPS pelo Let's Encrypt).
#   docker compose -f compose.vps.yml --env-file .env up -d --build
# O .env da VPS fica só na VPS (modelo: .env.example). Ver docs/operacao/deploy-vps.md.
name: agenteimobi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agente_imobi
      POSTGRES_USER: aim_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      AIM_APP_PASSWORD: ${AIM_APP_PASSWORD:?defina AIM_APP_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim_owner -d agente_imobi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]
    # Sem porta publicada: o banco só é visto pela api.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aim_app:${AIM_APP_PASSWORD}@db:5432/agente_imobi
      DATABASE_MIGRATION_URL: postgres://aim_owner:${POSTGRES_PASSWORD}@db:5432/agente_imobi
    depends_on:
      db:
        condition: service_healthy
    networks: [interna, wpxnet]
    # Sem porta publicada: o acesso é só pelo Traefik.
    labels:
      - traefik.enable=true
      - traefik.docker.network=wpxnet
      - traefik.http.routers.agenteimobi.rule=Host(`${APP_HOST:?defina APP_HOST}`)
      - traefik.http.routers.agenteimobi.entrypoints=websecure
      - traefik.http.routers.agenteimobi.tls.certresolver=letsencrypt
      - traefik.http.services.agenteimobi.loadbalancer.server.port=${PORT:-3000}
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  interna: {}
  wpxnet:
    external: true

volumes:
  db_data:
